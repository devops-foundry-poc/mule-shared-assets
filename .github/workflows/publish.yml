# Publishes the parent POM to GitHub Packages on every merge to main.
#
# Why GitHub Packages and not Anypoint Exchange:
# Exchange Maven facade v3 requires the exchange-mule-maven-plugin to pre-register
# asset metadata before accepting any PUT. That plugin only recognises Mule runtime
# asset types (mule-application, mule-domain, mule-policy) and rejects packaging=pom
# with HTTP 412. GitHub Packages is a standard Maven repository that accepts plain POMs.
#
# Child Mule apps activate the deploy-to-exchange-v3 profile in their own builds to
# publish application JARs to Exchange; they resolve the parent POM from GitHub Packages.
name: Publish parent POM

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write   # required to publish to GitHub Packages

jobs:
  publish:
    name: Strip SNAPSHOT → publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Java 17
        # TODO: pin to SHA — gh release view v4 -R actions/setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # setup-java writes a settings.xml <server id="github"> entry used for GitHub Packages auth.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Install Maven 3.8.8 (mule-maven-plugin 4.x incompatible with 3.9.x)
        run: |
          MVN_VERSION="3.8.8"
          MVN_HOME="${HOME}/.local/apache-maven-${MVN_VERSION}"
          if [ ! -d "${MVN_HOME}" ]; then
            curl -qL \
              "https://archive.apache.org/dist/maven/maven-3/${MVN_VERSION}/binaries/apache-maven-${MVN_VERSION}-bin.tar.gz" \
              -o /tmp/maven.tar.gz
            mkdir -p "${HOME}/.local"
            tar -xzf /tmp/maven.tar.gz -C "${HOME}/.local/"
            rm /tmp/maven.tar.gz
          fi
          echo "MVN=${MVN_HOME}/bin/mvn" >> "$GITHUB_ENV"

      - name: Strip -SNAPSHOT and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$($MVN help:evaluate \
            -Dexpression=project.version -q -DforceStdout \
            --no-transfer-progress --batch-mode)
          RELEASE="${VERSION%-SNAPSHOT}"
          echo "Publishing version: ${RELEASE}"
          $MVN versions:set \
            -DnewVersion="${RELEASE}" \
            -DgenerateBackupFiles=false \
            --no-transfer-progress --batch-mode
          $MVN deploy \
            --no-transfer-progress --batch-mode
