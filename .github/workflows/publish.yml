# Publishes the parent POM to Anypoint Exchange on every merge to main.
# Calls the org-level reusable workflow from mule-cicd-workflows.
name: Publish to Exchange

on:
  push:
    branches: [main]

# Least-privilege: this workflow only reads repo contents and calls a reusable workflow.
permissions:
  contents: read

jobs:
  publish:
    name: Publish parent POM to Exchange
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/exchange-publish.yml@main
    with:
      # Plain POM: skip exchange-mule-maven-plugin (HTTP 412 for non-Mule-app artifacts).
      is_mule_app: false
      upload_artifact: false
    secrets:
      connected_app_client_id: ${{ secrets.SHARED_ASSETS_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.SHARED_ASSETS_CLIENT_SECRET }}
